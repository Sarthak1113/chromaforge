<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Spectrum Glow Ring -->
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="35%" stop-color="#ec4899" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Monogram Gradient -->
    <linearGradient id="monogram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="#27272a" stroke-width="12" />

  <!-- Outer Spectrum Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#spectrum)" stroke-width="28" stroke-linecap="round" stroke-dasharray="800 200" transform="rotate(-45 256 256)" />

  <!-- Inner Color Swatches Ring -->
  <circle cx="256" cy="116" r="22" fill="#6366f1" />
  <circle cx="376" cy="196" r="22" fill="#ec4899" />
  <circle cx="376" cy="316" r="22" fill="#f59e0b" />
  <circle cx="256" cy="396" r="22" fill="#10b981" />
  <circle cx="136" cy="316" r="22" fill="#06b6d4" />
  <circle cx="136" cy="196" r="22" fill="#8b5cf6" />

  <!-- Center 'CF' Letters -->
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="108" font-weight="900" fill="url(#monogram)" text-anchor="middle" letter-spacing="-4">
    CF
  </text>
</svg>
